<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login | Ketabak</title>
    <meta name="description" content="Sign in to your Ketabak account to access your books, wishlist, shopping cart, and order details." />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    <!-- Initialize Theme quickly to prevent flash of light theme -->
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Welcome Back</h1>
      <p class="subtitle">Login to access your reading library</p>

      <form id="loginForm">
        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="john.doe@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" required />
        </div>

        <div class="remember-forgot">
          <div class="remember-me">
            <input type="checkbox" id="remember" name="remember" />
            <label for="remember">Remember me</label>
          </div>
          <a href="#" id="forgotPasswordLink">Forgot Password?</a>
        </div>

        <button type="submit" class="btn-primary">Login</button>
      </form>

      <div class="signup-link">
        Don't have an account? <a href="signup.html">Sign Up</a>
      </div>

      <a href="../index.html" class="back-to-home">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/toast.js"></script>
    <script src="../js/login.js" type="module"></script>
  </body>
</html>
