<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Create Account | Ketabak</title>
    <meta name="description" content="Sign up to Ketabak to save books to your wishlist, manage your shopping cart, and view your orders." />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    <!-- Initialize Theme quickly to prevent flash of light theme -->
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Create Account</h1>
      <p class="subtitle">Join our reading community today</p>

      <form id="signupForm">
        <div class="name-row">
          <div class="form-group">
            <label for="firstname">First Name</label>
            <input type="text" id="firstname" name="firstname" class="form-control" placeholder="John" required />
          </div>

          <div class="form-group">
            <label for="lastname">Last Name</label>
            <input type="text" id="lastname" name="lastname" class="form-control" placeholder="Doe" required />
          </div>
        </div>

        <div class="form-group">
          <label for="email">Email Address</label>
          <input type="email" id="email" name="email" class="form-control" placeholder="john.doe@example.com" required />
        </div>

        <div class="form-group">
          <label for="password">Password</label>
          <input type="password" id="password" name="password" class="form-control" placeholder="••••••••" minlength="6" required />
        </div>

        <div class="checkbox-group">
          <input type="checkbox" id="terms" name="terms" required />
          <label for="terms">I agree to the <a href="#">Terms and Conditions</a></label>
        </div>

        <button type="submit" class="btn-primary">Sign Up</button>
      </form>

      <div class="signin-link">
        Already have an account? <a href="login.html">Sign In</a>
      </div>

      <a href="../index.html" class="back-to-home">
        <i class="fas fa-arrow-left"></i> Back to Home
      </a>
    </div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <script src="../js/toast.js"></script>
    <script src="../js/signup.js" type="module"></script>
  </body>
</html>
