<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Ketabak</title>
    <meta name="description" content="Set a new password for your Ketabak account." />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link rel="stylesheet" href="../css/pages/auth.css" />
    <!-- Initialize Theme quickly to prevent flash of light theme -->
    <script src="../js/theme.js"></script>
  </head>
  <body>
    <div class="container">
      <h1>Reset Password</h1>
      <p class="subtitle">Please enter your new password below</p>

      <form id="resetPasswordForm">
        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input type="password" id="newPassword" name="newPassword" class="form-control" placeholder="••••••••" minlength="6" required />
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm Password</label>
          <input type="password" id="confirmPassword" name="confirmPassword" class="form-control" placeholder="••••••••" minlength="6" required />
        </div>

        <button type="submit" class="btn-primary">Update Password</button>
      </form>

      <a href="login.html" class="back-to-home" style="margin-top: 24px;">
        <i class="fas fa-arrow-left"></i> Back to Login
      </a>
    </div>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="../env.js"></script>
    <script src="../js/toast.js"></script>
    <script src="../js/controllers/reset-password.js" type="module"></script>
  </body>
</html>
